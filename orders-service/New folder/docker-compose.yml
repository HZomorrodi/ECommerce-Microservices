version: '3.8'

services:
  # ============================================
  # PRODUCT MICROSERVICE (MySQL)
  # ============================================
  
  mysql-productservice:
    image: mysql:8.0
    container_name: mysql-productservice
    hostname: mysql-host-productmicroservice
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: ecommerceproductsdatabase
    ports:
      - "3306:3306"
    networks:
      - products-mysql-network                           # ONLY database network
    volumes:
      - mysql-data:/var/lib/mysql
      - ./MySQL/db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin"]
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  products-api:
    image: my-dotnet-app:initial
    container_name: products-api-service
    build:
      context: ../eCommerceSolution.ProductsService
      dockerfile: ProductsMicroService.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MYSQL_HOST: mysql-productservice
      MYSQL_PASSWORD: admin
    ports:
      - "8080:8080"
      - "8081:8081"
    networks:
      - products-mysql-network                           # Database access
      - ecommerce-network                                 # Cross-service communication
    depends_on:
      mysql-productservice:
        condition: service_healthy
    restart: unless-stopped

  # ============================================
  # USER MICROSERVICE (PostgreSQL)
  # ============================================
  
  postgres-userservice:
    image: postgres:16-alpine
    container_name: postgres-userservice
    hostname: postgres-host-usermicroservice
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ecommerceusersdatabase
    ports:
      - "5432:5432"
    networks:
      - users-postgres-network                           # ONLY database network
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./POSTGRES/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "ecommerceusersdatabase"]
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  users-api:
    image: users-microservice:1.0
    container_name: users-api-service
    build:
      context: ../eCommerceSolution.UsersService
      dockerfile: eCommerce.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      POSTGRES_HOST: postgres-userservice
      POSTGRES_PASSWORD: admin
    ports:
      - "8090:8080"
      - "8091:8081"
    networks:
      - users-postgres-network                           # Database access
      - ecommerce-network                                 # Cross-service communication
    depends_on:
      postgres-userservice:
        condition: service_healthy
    restart: unless-stopped

  # ============================================
  # ORDERS MICROSERVICE (MongoDB)
  # ============================================
  
  mongodb-orderservice:
    image: mongo:7.0
    container_name: mongodb-orderservice
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: OrdersDatabase
    ports:
      - "27017:27017"
    networks:
      - orders-mongodb-network                           # ONLY database network
    volumes:
      - mongodb-data:/data/db
      - ./MongoDB/init.js:/docker-entrypoint-initdb.d/init.js
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  orders-api:
    image: orders-microservice:1.0
    container_name: orders-api-service
    build:
      context: ../eCommerceSolution.OrdersService
      dockerfile: OrdersMicroservice.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MongoDB: mongodb://admin:admin@mongodb-orderservice:27017/OrdersDatabase?authSource=admin
    ports:
      - "8100:8080"
      - "8101:8081"
    networks:
      - orders-mongodb-network                           # Database access
      - ecommerce-network                                 # Cross-service communication
    depends_on:
      mongodb-orderservice:
        condition: service_healthy
    restart: unless-stopped

# ============================================
# NETWORKS
# ============================================

networks:
  # Isolated database networks (only database + its API)
  products-mysql-network:
    driver: bridge
  users-postgres-network:
    driver: bridge
  orders-mongodb-network:
    driver: bridge
  
  # Shared network for cross-service API communication
  ecommerce-network:
    driver: bridge
    name: ecommerce-network

# ============================================
# VOLUMES
# ============================================

volumes:
  mysql-data:
    driver: local
  postgres-data:
    driver: local
  mongodb-data:
    driver: local